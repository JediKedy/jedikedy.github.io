<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamLine TV</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        video::-webkit-media-controls-enclosure { border-radius: 0; }
        .active-channel { background: rgba(59, 130, 246, 0.1); border-left: 3px solid #3b82f6; }
    </style>
</head>
<body class="bg-[#050505] text-slate-200 h-full overflow-hidden">

<div class="flex flex-col h-full">
    <header class="flex items-center justify-between px-4 py-3 bg-black/50 backdrop-blur-md border-b border-white/5 shrink-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-blue-500 rounded-full shadow-[0_0_8px_#3b82f6]"></div>
            <h1 class="text-sm font-semibold tracking-widest uppercase">Stream<span class="text-blue-500">Line</span></h1>
        </div>

        <div class="flex items-center gap-3">
            <div class="relative group">
                <input type="text" id="searchInput" placeholder="Kanal ara..." onkeyup="search(this.value)" 
                    class="bg-white/5 border border-white/10 text-xs rounded-full pl-8 pr-4 py-1.5 w-32 md:w-64 focus:w-48 md:focus:w-80 focus:bg-white/10 focus:ring-1 focus:ring-blue-500 transition-all outline-none">
                <svg class="w-3.5 h-3.5 absolute left-3 top-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2" stroke-linecap="round"/></svg>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden p-2 bg-white/5 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <aside id="sidebar" class="absolute inset-0 z-40 translate-x-full md:translate-x-0 md:relative md:w-80 bg-[#0a0a0a] border-r border-white/5 flex flex-col transition-transform duration-300 ease-in-out">
            <div class="flex p-2 gap-1 border-b border-white/5">
                <button onclick="switchTab('all', this)" class="tab-btn flex-1 py-2 text-[10px] font-bold uppercase rounded-md transition-all bg-white/10 text-white">Tümü</button>
                <button onclick="switchTab('fav', this)" class="tab-btn flex-1 py-2 text-[10px] font-bold uppercase rounded-md transition-all text-slate-500 hover:text-white">Favoriler</button>
            </div>

            <div id="channelList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-0.5">
                <div class="animate-pulse space-y-2 p-4">
                    <div class="h-10 bg-white/5 rounded"></div>
                    <div class="h-10 bg-white/5 rounded"></div>
                    <div class="h-10 bg-white/5 rounded"></div>
                </div>
            </div>

            <div class="p-3 bg-black/40 border-t border-white/5 flex justify-between items-center">
                <span id="chCount" class="text-[9px] font-medium text-slate-500 tracking-widest uppercase">Yükleniyor...</span>
                <button onclick="toggleSidebar()" class="md:hidden text-[9px] font-bold text-blue-500 uppercase">Kapat</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-black relative">
            
            <div class="relative w-full aspect-video bg-black group shadow-2xl">
                <div id="playerIdle" class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 border border-white/10 rounded-full flex items-center justify-center bg-white/5">
                        <svg class="w-5 h-5 text-slate-400" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <p class="text-[10px] font-medium tracking-[0.2em] text-slate-500 uppercase">Yayın seçiniz</p>
                </div>

                <video id="video" class="w-full h-full hidden" controls playsinline></video>
                
                <div id="videoOverlay" class="absolute top-4 left-4 z-20 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity">
                    <div id="liveBadge" class="hidden px-2 py-1 bg-red-600 text-[9px] font-black rounded-sm animate-pulse">LIVE</div>
                </div>
            </div>

            <div class="p-4 md:p-6 border-b border-white/5 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div id="npLogo" class="w-10 h-10 rounded bg-white/5 flex items-center justify-center border border-white/10 shrink-0 overflow-hidden">
                        <span class="text-xs">📺</span>
                    </div>
                    <div>
                        <h2 id="npTitle" class="text-sm font-bold text-white truncate max-w-[200px]">Yayın Yok</h2>
                        <p id="npGroup" class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Kanal Seçilmedi</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 self-end md:self-center">
                    <button onclick="prevCh()" class="p-2 hover:bg-white/10 rounded-full transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
                    <button onclick="nextCh()" class="p-2 hover:bg-white/10 rounded-full transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
                    <div class="w-px h-4 bg-white/10 mx-1"></div>
                    <button id="favCurBtn" onclick="favToggleCurrent()" class="p-2 hover:bg-white/10 rounded-full transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg></button>
                    <button onclick="openSleep()" class="p-2 hover:bg-white/10 rounded-full transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar">
                <h3 class="text-[10px] font-bold text-slate-500 tracking-[0.2em] uppercase mb-4">Keşfet</h3>
                <div id="relGrid" class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-3"></div>
            </div>
        </main>
    </div>
</div>

<div id="sleepModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
    <div class="bg-[#111] border border-white/10 p-6 rounded-2xl w-full max-w-xs shadow-2xl">
        <h2 class="text-sm font-bold mb-4 uppercase tracking-widest text-center">Uyku Zamanlayıcısı</h2>
        <div class="grid grid-cols-1 gap-2 mb-6">
            <button onclick="startSleep(15)" class="py-2 text-xs bg-white/5 hover:bg-white/10 rounded-lg">15 Dakika</button>
            <button onclick="startSleep(30)" class="py-2 text-xs bg-white/5 hover:bg-white/10 rounded-lg">30 Dakika</button>
            <button onclick="startSleep(60)" class="py-2 text-xs bg-white/5 hover:bg-white/10 rounded-lg">1 Saat</button>
            <button onclick="startSleep(0)" class="py-2 text-xs text-red-500">İptal</button>
        </div>
        <button onclick="closeSleep()" class="w-full py-2 text-[10px] font-bold uppercase text-slate-500">Kapat</button>
    </div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] px-4 py-2 bg-blue-600 text-white text-[10px] font-bold rounded-full shadow-xl opacity-0 transition-all pointer-events-none uppercase tracking-widest"></div>

<script>
const M3U_URL = "https://raw.githubusercontent.com/JediKedy/tivimate/refs/heads/main/tivimate.m3u";
let hls, allChannels = [], favorites = JSON.parse(localStorage.getItem("favs") || "[]");
let currentCh = null, currentTab = "all", searchQ = "", sleepTimer;

const video = document.getElementById("video");

// Initial Setup
async function init() {
    try {
        const res = await fetch(M3U_URL);
        const text = await res.text();
        parseM3U(text);
        renderList();
        renderDiscovery();
    } catch (e) {
        document.getElementById("channelList").innerHTML = `<p class="p-4 text-center text-xs text-red-500">Bağlantı hatası.</p>`;
    }
}

function parseM3U(text) {
    const lines = text.split("\n");
    allChannels = [];
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes("#EXTINF")) {
            const info = lines[i];
            const name = info.split(",")[1]?.trim() || "Kanal";
            const url = lines[i+1]?.trim();
            const logo = info.match(/tvg-logo="([^"]*)"/)?.[1] || "";
            const group = info.match(/group-title="([^"]*)"/)?.[1] || "Genel";
            if(url && url.startsWith("http")) allChannels.push({ name, url, logo, group });
        }
    }
    document.getElementById("chCount").textContent = `${allChannels.length} KANAL`;
}

function renderList() {
    let list = allChannels;
    if (currentTab === "fav") list = list.filter(c => favorites.includes(c.url));
    if (searchQ) list = list.filter(c => c.name.toLowerCase().includes(searchQ));

    const container = document.getElementById("channelList");
    container.innerHTML = list.map((ch, idx) => `
        <div onclick="play('${ch.url}')" class="flex items-center gap-3 p-2 rounded-lg cursor-pointer hover:bg-white/5 transition-all ${currentCh?.url === ch.url ? 'active-channel' : ''}">
            <div class="w-8 h-8 rounded bg-black flex items-center justify-center shrink-0 border border-white/5 overflow-hidden">
                ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.remove()">` : ''}
                <span class="text-[10px]">📺</span>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-[11px] font-medium text-slate-200 truncate">${ch.name}</p>
                <p class="text-[9px] text-slate-600 uppercase tracking-tighter">${ch.group}</p>
            </div>
            <button onclick="event.stopPropagation(); toggleFav('${ch.url}')" class="p-1.5 ${favorites.includes(ch.url) ? 'text-blue-500' : 'text-slate-700'}">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
        </div>
    `).join("");
}

function play(url) {
    const ch = allChannels.find(c => c.url === url);
    if (!ch) return;
    currentCh = ch;

    // UI Updates
    document.getElementById("playerIdle").classList.add("hidden");
    video.classList.remove("hidden");
    document.getElementById("liveBadge").classList.remove("hidden");
    document.getElementById("npTitle").textContent = ch.name;
    document.getElementById("npGroup").textContent = ch.group;
    document.getElementById("npLogo").innerHTML = ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain">` : "📺";
    
    // HLS Logic
    if (hls) hls.destroy();
    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
    }

    if(window.innerWidth < 768) toggleSidebar(false);
    updateFavUI();
    renderList();
    showToast(ch.name);
}

// Logic Helpers
function toggleSidebar(force) {
    const s = document.getElementById("sidebar");
    if(force === false) s.classList.add("translate-x-full");
    else s.classList.toggle("translate-x-full");
}

function search(q) { searchQ = q.toLowerCase(); renderList(); }

function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.className = "tab-btn flex-1 py-2 text-[10px] font-bold uppercase rounded-md transition-all text-slate-500");
    btn.className = "tab-btn flex-1 py-2 text-[10px] font-bold uppercase rounded-md transition-all bg-white/10 text-white";
    renderList();
}

function toggleFav(url) {
    if (favorites.includes(url)) favorites = favorites.filter(u => u !== url);
    else favorites.push(url);
    localStorage.setItem("favs", JSON.stringify(favorites));
    renderList();
    updateFavUI();
}

function updateFavUI() {
    const btn = document.getElementById("favCurBtn");
    const isFav = currentCh && favorites.includes(currentCh.url);
    btn.classList.toggle("text-blue-500", isFav);
}

function favToggleCurrent() { if(currentCh) toggleFav(currentCh.url); }

function nextCh() {
    const idx = allChannels.findIndex(c => c.url === currentCh?.url);
    play(allChannels[(idx + 1) % allChannels.length].url);
}

function prevCh() {
    const idx = allChannels.findIndex(c => c.url === currentCh?.url);
    play(allChannels[(idx - 1 + allChannels.length) % allChannels.length].url);
}

function renderDiscovery() {
    const grid = document.getElementById("relGrid");
    const shuffle = [...allChannels].sort(() => 0.5 - Math.random()).slice(0, 12);
    grid.innerHTML = shuffle.map(ch => `
        <div onclick="play('${ch.url}')" class="bg-white/5 p-2 rounded-xl hover:bg-white/10 transition-all cursor-pointer text-center">
            <div class="aspect-square bg-black rounded-lg mb-2 flex items-center justify-center border border-white/5 overflow-hidden">
                ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain p-1">` : '📺'}
            </div>
            <p class="text-[9px] font-bold truncate text-slate-400 uppercase tracking-tighter">${ch.name}</p>
        </div>
    `).join("");
}

// Sleep Timer
function openSleep() { document.getElementById("sleepModal").classList.replace("hidden", "flex"); }
function closeSleep() { document.getElementById("sleepModal").classList.replace("flex", "hidden"); }
function startSleep(m) {
    clearTimeout(sleepTimer);
    if(m > 0) {
        sleepTimer = setTimeout(() => { video.pause(); showToast("Uyku modu aktif"); }, m * 60000);
        showToast(`${m} dk sonra kapanacak`);
    } else {
        showToast("Zamanlayıcı iptal");
    }
    closeSleep();
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = t.className.replace("opacity-0", "opacity-100 translate-y-[-10px]");
    setTimeout(() => {
        t.className = t.className.replace("opacity-100 translate-y-[-10px]", "opacity-0");
    }, 2000);
}

init();
</script>
</body>
</html>
