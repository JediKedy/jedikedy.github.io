<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANLI TV PRO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Film Grain Overlay */
        .grain::before {
            content: "";
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 50; opacity: 0.2;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 h-full overflow-hidden grain">

<div class="flex flex-col h-full">
    <header class="flex items-center justify-between px-6 py-4 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 shrink-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div>
            <h1 class="text-xl font-bold tracking-tighter text-white">CANLI<span class="text-red-500">TV</span></h1>
        </div>

        <div class="flex items-center gap-4">
            <span id="ch-counter" class="hidden md:block text-xs font-medium text-slate-500 tracking-widest uppercase">0 KANAL</span>
            <a href="https://github.com/JediKedy/jedikedy.github.io/blob/main/player.html" target="_blank" class="hidden sm:flex items-center gap-2 bg-sky-600/10 hover:bg-sky-600/20 text-sky-400 px-4 py-2 rounded-lg text-sm font-semibold transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
                Developer
            </a>
            <div class="relative">
                <span class="absolute inset-y-0 left-3 flex items-center text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text" placeholder="Kanal ara..." onkeyup="search(this.value)" 
                    class="bg-slate-800 border-none text-slate-200 text-sm rounded-xl pl-10 pr-4 py-2 w-40 md:w-64 focus:ring-2 focus:ring-red-500 transition-all outline-none">
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
        
        <aside class="w-full md:w-[320px] bg-slate-900/50 border-r border-slate-800 flex flex-col shrink-0">
            <div class="flex p-2 bg-slate-900">
                <button onclick="switchTab('all', this)" class="tab-btn flex-1 py-3 text-xs font-bold tracking-widest uppercase rounded-lg transition-all text-white bg-slate-800 shadow-lg">TÜMÜ</button>
                <button onclick="switchTab('fav', this)" class="tab-btn flex-1 py-3 text-xs font-bold tracking-widest uppercase rounded-lg transition-all text-slate-500 hover:text-white">FAVORİLER</button>
            </div>

            <div id="catBar" class="flex gap-2 p-3 overflow-x-auto hide-scrollbar border-b border-slate-800/50">
                </div>

            <div class="px-4 py-2 flex justify-between items-center bg-slate-900/30">
                <span id="chCount" class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Yükleniyor...</span>
            </div>

            <div id="channelList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                <div class="flex flex-col items-center justify-center py-12 gap-3 opacity-50">
                    <div class="w-8 h-8 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-xs font-medium uppercase tracking-widest">Liste Hazırlanıyor</span>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-slate-950 overflow-hidden relative">
            
            <div class="w-full bg-black relative group shadow-2xl">
                <div class="aspect-video w-full max-h-[70vh] flex items-center justify-center relative bg-slate-900">
                    
                    <div id="playerIdle" class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-4 bg-gradient-to-t from-slate-950 to-slate-900">
                        <div class="p-6 bg-slate-800/50 rounded-full animate-pulse">
                            <svg class="w-12 h-12 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <span class="text-sm font-bold tracking-widest text-slate-500 uppercase">İzlemek için bir kanal seçin</span>
                    </div>

                    <video id="video" class="w-full h-full hidden" controls playsinline></video>
                    
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-20">
                        <button onclick="openFS()" class="pointer-events-auto bg-black/60 backdrop-blur-md border border-white/10 text-white px-6 py-2.5 rounded-full text-xs font-bold tracking-widest hover:bg-red-600 transition-colors uppercase">
                            Tam Ekran
                        </button>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row items-center gap-4 p-4 bg-slate-900 border-t border-slate-800">
                    <div class="flex items-center gap-4 flex-1 w-full min-w-0">
                        <div id="npLogo" class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center shrink-0 border border-slate-700 overflow-hidden">
                            <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center gap-2">
                                <h2 id="npTitle" class="text-sm font-bold text-white truncate uppercase tracking-tight">Kanal Seçilmedi</h2>
                                <span id="onAirBadge" class="hidden px-2 py-0.5 rounded bg-red-500 text-[10px] font-black animate-pulse">CANLI</span>
                            </div>
                            <p id="npGroup" class="text-xs text-slate-500 font-medium">Lütfen kanal listesine göz atın</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        <div class="flex items-center gap-3 bg-slate-800/50 px-4 py-2 rounded-xl border border-slate-700/50">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                            <input type="range" class="w-20 h-1.5 accent-red-500 bg-slate-700 rounded-lg cursor-pointer" min="0" max="100" value="100" oninput="setVol(this.value)">
                        </div>
                        <button onclick="prevCh()" class="ctrl-btn" title="Geri">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
                        </button>
                        <button onclick="nextCh()" class="ctrl-btn" title="İleri">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
                        </button>
                        <button id="favCurBtn" onclick="favToggleCurrent()" class="ctrl-btn">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                        </button>
                        <button onclick="openSleep()" class="ctrl-btn">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </button>
                        <button onclick="stopPlayer()" class="ctrl-btn text-red-500 bg-red-500/10 hover:bg-red-500 hover:text-white border-red-500/20">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
                <h3 class="text-[10px] font-black text-slate-500 tracking-[0.2em] uppercase mb-6 flex items-center gap-3">
                    Önerilen Yayınlar <span class="h-[1px] flex-1 bg-slate-800"></span>
                </h3>
                <div id="relGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                    </div>
            </div>
        </main>
    </div>
</div>

<div id="sleepModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl w-full max-w-sm shadow-2xl scale-in">
        <h2 class="text-xl font-bold mb-6 flex items-center gap-3">
            <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Uyku Zamanlayıcısı
        </h2>
        <div class="grid grid-cols-2 gap-3 mb-8">
            <button onclick="pickTimer(15,this)" class="t-opt">15 Dakika</button>
            <button onclick="pickTimer(30,this)" class="t-opt active">30 Dakika</button>
            <button onclick="pickTimer(60,this)" class="t-opt">1 Saat</button>
            <button onclick="pickTimer(0,this)" class="t-opt col-span-2 text-red-400">İptal Et</button>
        </div>
        <div id="timerCd" class="text-center text-xs font-bold text-amber-500 mb-6 hidden"></div>
        <div class="flex gap-3">
            <button onclick="closeSleep()" class="flex-1 py-3 text-sm font-bold bg-slate-800 rounded-xl hover:bg-slate-700 transition-colors">Vazgeç</button>
            <button onclick="startSleep()" class="flex-1 py-3 text-sm font-bold bg-red-600 rounded-xl hover:bg-red-700 transition-colors shadow-lg shadow-red-900/20">Başlat</button>
        </div>
    </div>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 bg-white text-slate-950 text-xs font-bold rounded-full shadow-2xl opacity-0 translate-y-4 transition-all pointer-events-none uppercase tracking-widest"></div>

<script>
/* ══ CONFIG ══ */
const M3U_URL = "https://raw.githubusercontent.com/JediKedy/tivimate/refs/heads/main/tivimate.m3u";

let hls;
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let allChannels = [];
let currentCh = null;
let currentTab = "all";
let currentCat = "";
let searchQ = "";

const video = document.getElementById("video");
const channelList = document.getElementById("channelList");

/* ══ TAILWIND HELPERS ══ */
const ctrlBtnClass = "p-2.5 rounded-xl bg-slate-800 border border-slate-700/50 hover:bg-slate-700 text-slate-300 transition-all active:scale-95";
document.querySelectorAll('.ctrl-btn').forEach(btn => btn.className = ctrlBtnClass);

const tOptClass = "p-3 text-xs font-bold bg-slate-800 border border-slate-700 rounded-xl hover:border-red-500 transition-all";
document.querySelectorAll('.t-opt').forEach(btn => btn.className += " " + tOptClass);

/* ══ CORE LOGIC ══ */
async function loadM3U() {
    try {
        const response = await fetch(M3U_URL);
        const data = await response.text();
        parseM3U(data);
    } catch (err) {
        channelList.innerHTML = `<div class="p-8 text-center text-red-400 text-xs font-bold">LİSTE YÜKLENEMEDİ</div>`;
    }
}

function parseM3U(text) {
    const lines = text.split("\n");
    allChannels = [];
    
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].startsWith("#EXTINF")) {
            const line = lines[i];
            const name = line.split(",")[1]?.trim() || "Bilinmeyen Kanal";
            const url = lines[i + 1]?.trim() || "";
            if (!url.startsWith("http")) continue;

            // Better regex for attributes
            const logo = line.match(/tvg-logo="([^"]*)"/i)?.[1] || "";
            const group = line.match(/group-title="([^"]*)"/i)?.[1] || "Genel";

            allChannels.push({ name, url, logo, group });
        }
    }
    
    document.getElementById("ch-counter").textContent = allChannels.length + " KANAL";
    buildCats();
    renderList();
    renderRelated();
}

function buildCats() {
    const groups = ["Tümü", ...new Set(allChannels.map(c => c.group))].slice(0, 25);
    const bar = document.getElementById("catBar");
    bar.innerHTML = groups.map(g => `
        <button onclick="filterCat('${g}', this)" 
            class="cat-pill shrink-0 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border border-slate-800 transition-all
            ${g === 'Tümü' ? 'bg-red-500 text-white border-red-500' : 'bg-slate-900 text-slate-500 hover:text-slate-300'}">
            ${g}
        </button>
    `).join("");
}

function filterCat(cat, el) {
    currentCat = cat === "Tümü" ? "" : cat;
    document.querySelectorAll(".cat-pill").forEach(p => {
        p.className = "cat-pill shrink-0 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border border-slate-800 transition-all bg-slate-900 text-slate-500";
    });
    el.className = "cat-pill shrink-0 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border border-red-500 bg-red-500 text-white transition-all shadow-lg shadow-red-500/20";
    renderList();
}

function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => {
        b.classList.remove("bg-slate-800", "text-white", "shadow-lg");
        b.classList.add("text-slate-500");
    });
    btn.classList.add("bg-slate-800", "text-white", "shadow-lg");
    renderList();
}

function renderList() {
    let list = allChannels;
    if (currentTab === "fav") list = list.filter(c => favorites.includes(c.url));
    if (currentCat) list = list.filter(c => c.group === currentCat);
    if (searchQ) list = list.filter(c => c.name.toLowerCase().includes(searchQ));

    document.getElementById("chCount").textContent = `${list.length} KANAL BULUNDU`;

    if (!list.length) {
        channelList.innerHTML = `<div class="py-20 text-center text-slate-600 text-[10px] font-bold tracking-[0.2em] uppercase">Sonuç Bulunamadı</div>`;
        return;
    }

    channelList.innerHTML = list.map(ch => {
        const mainIdx = allChannels.indexOf(ch);
        const isActive = currentCh?.url === ch.url;
        const isFav = favorites.includes(ch.url);
        
        return `
            <div onclick="play(${mainIdx})" 
                class="group flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all border border-transparent
                ${isActive ? 'bg-red-500/10 border-red-500/20' : 'hover:bg-slate-800/50'}">
                
                <div class="w-10 h-10 rounded-lg bg-slate-800 shrink-0 border border-slate-700/50 flex items-center justify-center overflow-hidden">
                    ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain p-1" onerror="this.outerHTML='📺'">` : '<span class="text-xs">📺</span>'}
                </div>

                <div class="flex-1 min-w-0">
                    <h4 class="text-xs font-bold truncate uppercase tracking-tight ${isActive ? 'text-red-500' : 'text-slate-200'}">${ch.name}</h4>
                    <p class="text-[10px] text-slate-500 font-medium truncate uppercase">${ch.group}</p>
                </div>

                <button onclick="event.stopPropagation(); toggleFavorite('${ch.url}', this)" 
                    class="p-2 rounded-lg transition-colors ${isFav ? 'text-amber-500' : 'text-slate-600 hover:text-slate-400'}">
                    <svg class="w-4 h-4" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.175 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.382-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                    </svg>
                </button>
            </div>
        `;
    }).join("");
}

/* ── PLAYER ACTIONS ── */
function play(idx) {
    const ch = allChannels[idx];
    if (!ch) return;
    currentCh = ch;

    document.getElementById("playerIdle").classList.add("hidden");
    video.classList.remove("hidden");
    document.getElementById("onAirBadge").classList.remove("hidden");

    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
        hls = new Hls({ capLevelToPlayerSize: true });
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => console.log("Autoplay blocked")));
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = ch.url;
        video.play();
    }

    // Update UI
    document.getElementById("npTitle").textContent = ch.name;
    document.getElementById("npGroup").textContent = ch.group;
    document.getElementById("npLogo").innerHTML = ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain p-1">` : "📺";
    
    updateFavUI();
    renderList();
    showToast("BAĞLANILIYOR: " + ch.name);
}

function stopPlayer() {
    if (hls) { hls.destroy(); hls = null; }
    video.pause(); video.src = "";
    video.classList.add("hidden");
    document.getElementById("playerIdle").classList.remove("hidden");
    document.getElementById("onAirBadge").classList.add("hidden");
    document.getElementById("npTitle").textContent = "Kanal Seçilmedi";
    document.getElementById("npGroup").textContent = "Lütfen kanal listesine göz atın";
    document.getElementById("npLogo").innerHTML = "📺";
    currentCh = null;
    renderList();
}

/* ── HELPERS ── */
function search(q) {
    searchQ = q.toLowerCase();
    renderList();
}

function toggleFavorite(url, btn) {
    if (favorites.includes(url)) {
        favorites = favorites.filter(u => u !== url);
        showToast("Favorilerden çıkarıldı");
    } else {
        favorites.push(url);
        showToast("⭐ Favorilere eklendi");
    }
    localStorage.setItem("favorites", JSON.stringify(favorites));
    updateFavUI();
    renderList();
}

function updateFavUI() {
    if (!currentCh) return;
    const isFav = favorites.includes(currentCh.url);
    const btn = document.getElementById("favCurBtn");
    btn.innerHTML = `<svg class="w-5 h-5" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>`;
    btn.className = isFav ? ctrlBtnClass.replace('text-slate-300', 'text-amber-500') : ctrlBtnClass;
}

function favToggleCurrent() {
    if (currentCh) toggleFavorite(currentCh.url);
}

function setVol(v) { video.volume = v / 100; }

function openFS() {
    const wrap = video.parentElement;
    if (wrap.requestFullscreen) wrap.requestFullscreen();
    else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
}

function nextCh() {
    const list = getActiveContextList();
    if (!list.length) return;
    const idx = list.findIndex(c => c.url === currentCh?.url);
    play(allChannels.indexOf(list[(idx + 1) % list.length]));
}

function prevCh() {
    const list = getActiveContextList();
    if (!list.length) return;
    const idx = list.findIndex(c => c.url === currentCh?.url);
    play(allChannels.indexOf(list[(idx - 1 + list.length) % list.length]));
}

function getActiveContextList() {
    let list = allChannels;
    if (currentTab === "fav") list = list.filter(c => favorites.includes(c.url));
    if (currentCat) list = list.filter(c => c.group === currentCat);
    return list;
}

function renderRelated() {
    const grid = document.getElementById("relGrid");
    const shuffle = [...allChannels].sort(() => 0.5 - Math.random()).slice(0, 12);
    grid.innerHTML = shuffle.map(ch => `
        <div onclick="play(${allChannels.indexOf(ch)})" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl hover:bg-slate-800 hover:border-slate-700 transition-all cursor-pointer group">
            <div class="aspect-square bg-slate-950 rounded-xl mb-3 flex items-center justify-center overflow-hidden border border-slate-800 group-hover:border-red-500/30 transition-all">
                ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain p-2" onerror="this.outerHTML='📺'">` : '📺'}
            </div>
            <h5 class="text-[10px] font-black text-slate-300 truncate uppercase tracking-tighter">${ch.name}</h5>
        </div>
    `).join("");
}

/* ── SLEEP TIMER ── */
let sleepMins = 30, sleepTimer, cdInt;
function openSleep() { document.getElementById("sleepModal").classList.replace("hidden", "flex"); }
function closeSleep() { document.getElementById("sleepModal").classList.replace("flex", "hidden"); }

function pickTimer(m, el) {
    sleepMins = m;
    document.querySelectorAll(".t-opt").forEach(o => o.classList.remove("border-red-500", "bg-red-500/10", "text-red-500"));
    if (m !== 0) el.classList.add("border-red-500", "bg-red-500/10", "text-red-500");
}

function startSleep() {
    clearTimeout(sleepTimer); clearInterval(cdInt);
    if (sleepMins === 0) {
        showToast("ZAMANLAYICI İPTAL EDİLDİ");
        closeSleep(); return;
    }
    const end = Date.now() + (sleepMins * 60000);
    sleepTimer = setTimeout(stopPlayer, sleepMins * 60000);
    
    document.getElementById("timerCd").classList.remove("hidden");
    cdInt = setInterval(() => {
        const rem = Math.round((end - Date.now()) / 1000);
        if (rem <= 0) { clearInterval(cdInt); document.getElementById("timerCd").classList.add("hidden"); }
        document.getElementById("timerCd").textContent = `KAPANACAK: ${Math.floor(rem/60)}:${(rem%60).toString().padStart(2,'0')}`;
    }, 1000);
    
    showToast(`${sleepMins} DAKİKA SONRA KAPANACAK`);
    closeSleep();
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.replace("opacity-0", "opacity-100");
    t.classList.replace("translate-y-4", "translate-y-0");
    setTimeout(() => {
        t.classList.replace("opacity-100", "opacity-0");
        t.classList.replace("translate-y-0", "translate-y-4");
    }, 2500);
}

// Hotkeys
document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") nextCh();
    if (e.key === "ArrowLeft") prevCh();
    if (e.key === "Escape") stopPlayer();
    if (e.key === "f") openFS();
});

loadM3U();
</script>
